# Installed to /etc/systemd/logind.conf.d/ by install.sh.
# The MentorPi container shares the host /dev (incl. /dev/shm) and its ROS 2 nodes run as
# uid 1000, the same uid as the main host user. With the default RemoveIPC=yes, logind deletes
# all of that uid's shared memory when the user's last login session closes (e.g. after an
# SSH logout). Fast DDS then can't serve new subscribers: status.sh, web UI and video get no data.
[Login]
RemoveIPC=no
